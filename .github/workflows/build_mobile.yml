name: Build Mobile & Desktop (Android, iOS, Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: fottbol-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build iOS App (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Payload as IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r FOTTBOL_iOS_unsigned.ipa Payload
          cd ../../..

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: fottbol-ios-unsigned-ipa
          path: build/ios/iphoneos/FOTTBOL_iOS_unsigned.ipa

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows App (Release)
        run: flutter build windows --release

      - name: Compress Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\FOTTBOL_Windows_x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fottbol-windows-release-zip
          path: build/FOTTBOL_Windows_x64.zip

  publish-release:
    name: Publish Release (Auto Build)
    runs-on: ubuntu-latest
    needs: [build-android, build-ios, build-windows]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: fottbol-android-release-apk
          path: release-assets/

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: fottbol-ios-unsigned-ipa
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: fottbol-windows-release-zip
          path: release-assets/

      - name: Extract Version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -n 1 | cut -d ' ' -f 2 | cut -d '+' -f 1 | tr -d '\r')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: "FOTTBOL v${{ steps.get_version.outputs.VERSION }} (Otomatik Derleme)"
          make_latest: true
          body: |
            ## 🚀 FOTTBOL v${{ steps.get_version.outputs.VERSION }}
            Bu sürüm GitHub Actions tarafından otomatik olarak derlenmiştir.
            
            - 🖥️ **Windows:** `FOTTBOL_Windows_x64.zip` (Masaüstü Uygulaması)
            - 🤖 **Android:** `app-release.apk`
            - 🍏 **iOS:** `FOTTBOL_iOS_unsigned.ipa`
            
            *Tarih:* ${{ github.event.head_commit.timestamp }}
            *Son Değişiklik:* ${{ github.event.head_commit.message }}
          files: |
            release-assets/app-release.apk
            release-assets/FOTTBOL_iOS_unsigned.ipa
            release-assets/FOTTBOL_Windows_x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
